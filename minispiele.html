<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="images/output-onlinepngtools.png">
  <title>Mini-Spiele</title>
  <link rel="stylesheet" href="styles.css">

  <style>
    .wordle-container { 
  text-align: center; 
}

/* Spielfeld */
.wordle-grid {
  display: grid;
  grid-template-columns: repeat(5, 50px);
  gap: 8px;
  justify-content: center;
  margin: 30px 0;
}

.wordle-cell {
  width: 50px;
  height: 50px;
  border: 2px solid #393746;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  font-weight: bold;
  text-transform: uppercase;
}

.correct { background: #22c55e; }
.present { background: #eab308; }
.wrong { background: #292638; }

/* Input */
.wordle-input {
  padding: 10px;
  border-radius: 8px;
  border: none;
  font-size: 16px;
  margin-top: 10px;
}

.wordle-button {
  padding: 10px 15px;
  margin-left: 5px;
  border-radius: 8px;
  border: none;
  background: #7654d4;
  color: #ffffff;
  cursor: pointer;
  font-size: 16px;
  font-weight: 700;
}

.wordle-message {
  margin-top: 10px;
  font-weight: bold;
}

.wordle-input-label {
  display: block;
  margin: 16px 0 8px;
  color: #cbc8d6;
  font-size: 14px;
  font-weight: 600;
}

.wordle-length-hint {
  margin: 8px 0 0;
  color: #aaa8b8;
  font-size: 12px;
}

.word-length-preview {
  display: flex;
  justify-content: center;
  gap: 6px;
}

.word-length-cell {
  display: grid;
  width: 34px;
  height: 38px;
  place-items: center;
  border: 1px solid #393746;
  border-radius: 6px;
  color: #f6f4fb;
  font-size: 17px;
  font-weight: 700;
  text-transform: uppercase;
}

.word-length-cell.is-filled {
  border-color: #a78bfa;
  background: rgba(167, 139, 250, 0.1);
}

.wordle-attempts {
  margin: 0;
  color: #aaa8b8;
  font-size: 14px;
}

/* ===================== */
/* KEYBOARD DESKTOP */
/* ===================== */

.keyboard {
  margin-top: 30px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: center;
}

.keyboard-row {
  display: flex;
  gap: 6px;
  justify-content: center;
}

.key {
  padding: 10px 12px;
  background: #1b1a26;
  border-radius: 6px;
  cursor: pointer;
  user-select: none;
  font-weight: bold;
  transition: 0.2s;
  min-width: 32px;
  text-align: center;
  text-transform: uppercase;
}

.key.used {
  background: #0b0b12;
  opacity: 0.5;
}

.key.correct { background: #22c55e; opacity: 1; }
.key.present { background: #eab308; opacity: 1; }

/* Animationen */
@keyframes pop {
  0% { transform: scale(0.7); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

@keyframes flip {
  0% { transform: rotateX(0); }
  50% { transform: rotateX(90deg); }
  100% { transform: rotateX(0); }
}

/* ===================== */
/* 📱 MOBILE FIX */
/* ===================== */

@media (max-width: 768px) {

  /* Spielfeld kleiner */
  .wordle-grid {
    grid-template-columns: repeat(5, 40px);
    gap: 6px;
  }

  .wordle-cell {
    width: 40px;
    height: 40px;
    font-size: 18px;
  }

  /* Input + Button */
  .wordle-input,
  .wordle-button {
    width: 100%;
    margin: 6px 0;
  }

  /* Keyboard auf Grid umstellen */
  .keyboard {
    width: 100%;
  }

  .keyboard-row {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 5px;
  }

  .keyboard-row:nth-child(2) {
    grid-template-columns: repeat(9, 1fr);
    margin: 0 5%;
  }

  .keyboard-row:nth-child(3) {
    grid-template-columns: repeat(7, 1fr);
    margin: 0 15%;
  }

  .key {
    padding: 10px 0;
    font-size: 13px;
  }
}

    /* ===== MOBILE FIX ===== */
    @media (max-width: 768px) {

      .app {
        display: flex;
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        padding: 12px 16px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 10px;
      }

      .brand-title {
        font-size: 16px;
      }

      .sidebar-nav {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        width: 100%;
      }

      .sidebar-nav li {
        margin: 0;
      }

      .sidebar-nav a {
        font-size: 15px;
        padding: 6px 10px;
      }

      .sidebar-nav li:last-child,
      .sidebar-nav li:nth-last-child(2) {
        width: 100%;
        margin-top: 4px;
      }

      .main {
        padding: 12px;
      }

      .topbar h1 {
        font-size: 20px;
      }

      .grid {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .card {
        width: 100%;
        padding: 14px;
      }

      /* Wordle kleiner skalieren */
      .wordle-grid {
        grid-template-columns: repeat(5, 40px);
        gap: 6px;
      }

      .wordle-cell {
        width: 40px;
        height: 40px;
        font-size: 18px;
      }

      /* Input + Button untereinander */
      .wordle-input,
      .wordle-button {
        width: 100%;
        margin: 6px 0;
      }

      /* Tastatur kompakter */
      .key {
        padding: 8px;
        font-size: 12px;
      }
    }
  </style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-blob">M</span>
      <div><p class="brand-title">Monomorto</p></div>
    </div>

    <ul class="sidebar-nav">
      <li><a href="index.html">Home</a></li>
      <li><a href="dart.html">Dart</a></li>
      <li><a href="projekte.html">Projekte</a></li>
      <li><a href="gaming.html">Gaming</a></li>
      <li><a href="minispiele.html" class="active">Mini-Spiele</a></li>
      <li style="margin-top: 12px;">
        <a href="impressum.html" class="meta-link">Impressum</a>
      </li>
      <li>
        <a href="datenschutz.html" class="meta-link">Datenschutz</a>
      </li>
    </ul>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1>Mini-Spiele</h1>
    </div>

    <div class="grid">
      <div class="card wordle-container">
        <h2>Tägliches Wordle</h2>

        <p id="attempts-remaining" class="wordle-attempts" aria-live="polite">Noch 6 Versuche</p>
        <div id="board"></div>

        <label class="wordle-input-label" for="guessInput">Dein Wort</label>
        <div class="word-length-preview" aria-hidden="true">
          <span class="word-length-cell"></span>
          <span class="word-length-cell"></span>
          <span class="word-length-cell"></span>
          <span class="word-length-cell"></span>
          <span class="word-length-cell"></span>
        </div>
        <p class="wordle-length-hint" id="wordle-length-hint">Gib ein Wort mit genau 5 Buchstaben ein.</p>
        <input id="guessInput" class="wordle-input" maxlength="5" aria-describedby="wordle-length-hint" placeholder="5 Buchstaben" autocomplete="off">
        <button class="wordle-button" onclick="submitGuess()">Raten</button>

        <p id="message" class="wordle-message"></p>

        <div class="keyboard" id="keyboard"></div>
      </div>
    </div>
  </main>

  <footer class="mobile-footer" aria-label="Rechtliche Informationen">
    <a href="impressum.html">Impressum</a>
    <a href="datenschutz.html">Datenschutz</a>
  </footer>
</div>

<script>
const words = [
"abend","achse","ahorn","apfel","acker","alter","ampel","angel","anker","armut","asche","atlas","audio","augen","autor","autos","azubi",
"bande","banjo","baron","basis","beere","beile","biene","birne","boden","bombe","bonus","brand","bucht","bulle","bunte",
"chaos","clown","coach","creme",
"danke","decke","delta","dicke","dinge","disco","dosen","drama","dreck","duell","durst",
"eimer","elite","engel","erben","essen","etage","eulen",
"fabel","faden","falle","farbe","feder","feuer","fisch","flame","flirt","fluch","folge","fuchs","funke",
"gabel","gasse","geier","geist","genie","glanz","golem",
"hafen","haken","halbe","hallo","hauch","hebel","hobby","hunde",
"ideal","insel",
"joker","junge",
"kakao","kanal","kater","kette","kiosk","klang","kleid","klima","knopf","koala",
"laden","lampe","lauch","leben","lehre","leise","linde","linie","lobby","luchs",
"magen","maler","mango","maske","meise","messe","meter","miete","milch","misch","motte",
"nadel","nacht","nager","narbe","nebel","neffe","niete","nobel","notiz",
"offen","olive","opfer","orden","orgel",
"pacht","panda","paris","party","pause","perle","pferd","pinsel","pirat","pixel","pizza",
"quark","queen","quitt",
"radio","ranke","raten","rebel","recht","regen","reise",
"sache","salat","schaf","schuh","seele","seife","seite",
"tacho","tante","taube","teich","tempo","tiger","tisch","titel","toast","trage","traum","trick","trost","tulpe",
"umweg","unmut","unter","uralt",
"vater","vegan","vogel",
"wache","waden","waffe","wagen","wange","weide","weiss","werft","wette","woche","wolke","wurst",
"yacht",
"zange","zeile","zebra","zicke","ziege","zunge"
];

function getDailyWord() {
  const start = new Date("2026-01-01");
  const today = new Date();
  const diff = Math.floor((today - start) / (1000*60*60*24));
  return words[diff % words.length];
}

const solution = getDailyWord();
let attempts = 0;
const maxAttempts = 6;
const usedLetters = new Set();
const attemptsRemaining = document.getElementById("attempts-remaining");
const guessInput = document.getElementById("guessInput");
const wordLengthCells = [...document.querySelectorAll(".word-length-cell")];

function updateWordLengthPreview() {
  const letters = [...guessInput.value];
  wordLengthCells.forEach((cell, index) => {
    cell.textContent = letters[index] || "";
    cell.classList.toggle("is-filled", Boolean(letters[index]));
  });
}

guessInput.addEventListener("input", updateWordLengthPreview);
guessInput.addEventListener("keydown", e => {
  if (e.key === "Enter") submitGuess();
});

function submitGuess() {
  const input = document.getElementById("guessInput");
  const guess = input.value.toLowerCase();

  if (guess.length !== 5) {
    showMessage("Bitte 5 Buchstaben eingeben");
    input.focus(); // 👈 bleibt offen
    return;
  }

  if (attempts >= maxAttempts) return;

  addRow(guess);
  updateKeyboard(guess);

  attempts++;
  const remaining = maxAttempts - attempts;
  attemptsRemaining.textContent = `Noch ${remaining} ${remaining === 1 ? "Versuch" : "Versuche"}`;

  if (guess === solution) {
    showMessage("Richtig! 🎉");
    input.disabled = true;
    return;
  } else if (attempts === maxAttempts) {
    showMessage("Lösung: " + solution.toUpperCase());
    input.disabled = true;
    return;
  }

  input.value = "";
  updateWordLengthPreview();

  // 🔥 WICHTIG: Tastatur offen halten
  input.focus();
}

function addRow(guess) {
  const board = document.getElementById("board");
  const row = document.createElement("div");
  row.className = "wordle-grid";

  for (let i = 0; i < 5; i++) {
    const cell = document.createElement("div");
    cell.className = "wordle-cell";
    cell.textContent = guess[i];

    cell.style.animation = `pop 0.2s ease ${i * 0.1}s`;

    setTimeout(() => {
      cell.style.animation = "flip 0.4s ease";

      if (guess[i] === solution[i]) {
        cell.classList.add("correct");
      } else if (solution.includes(guess[i])) {
        cell.classList.add("present");
      } else {
        cell.classList.add("wrong");
      }

    }, 300 + i * 200);

    row.appendChild(cell);
  }

  board.appendChild(row);
}

function createKeyboard() {
  const layout = ["qwertzuiop","asdfghjkl","yxcvbnm"];
  const kb = document.getElementById("keyboard");

  layout.forEach(rowLetters => {
    const row = document.createElement("div");
    row.className = "keyboard-row";

    rowLetters.split("").forEach(letter => {
      const key = document.createElement("div");
      key.className = "key";
      key.textContent = letter;

      key.onclick = () => {
        const input = document.getElementById("guessInput");
        if (input.value.length < 5) {
          input.value += letter;
          updateWordLengthPreview();
        }
      };

      row.appendChild(key);
    });

    kb.appendChild(row);
  });
}

function updateKeyboard(guess) {
  guess.split("").forEach((letter, index) => {
    const key = [...document.querySelectorAll(".key")]
      .find(k => k.textContent.toLowerCase() === letter);

    if (!key) return;

    if (letter === solution[index]) {
      key.classList.remove("used", "present");
      key.classList.add("correct");
    } else if (solution.includes(letter)) {
      if (!key.classList.contains("correct")) {
        key.classList.remove("used");
        key.classList.add("present");
      }
    } else {
      if (!key.classList.contains("correct") && !key.classList.contains("present")) {
        key.classList.add("used");
      }
    }
  });
}

function showMessage(text) {
  document.getElementById("message").textContent = text;
}

createKeyboard();
</script>
</body>
</html>
